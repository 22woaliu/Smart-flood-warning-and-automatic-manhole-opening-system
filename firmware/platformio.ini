; ============================================================
;  IoT Roadside Drainage & Purification System
;  PlatformIO Configuration
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload speed (reduce if you get upload errors)
upload_speed = 921600

; Library dependencies
;   ESP32Servo     - servo control on ESP32
;   WebSockets     - WebSocket server for real-time dashboard
;   ArduinoJson    - JSON serialisation for the data payload
lib_deps =
    madhephaestus/ESP32Servo @ ^0.13.0
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.1.0

; Build flags - set your WiFi credentials here
build_flags =
    -DWIFI_SSID=`"DrainageSystem`"
    -DWIFI_PASS=`"drainage123`"
    -DDANGER_DISTANCE_CM=10
    -DSAFE_DISTANCE_CM=20
    -DFLOW_BLOCKAGE_THRESHOLD=0.5
